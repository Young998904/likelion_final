<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 통합 A/S 관리 시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<div class="login-card">
    <h1 class="login-title">통합 A/S 관리 시스템</h1>

    <!-- 로그인 실패/로그아웃 안내 메시지 -->
    <p class="alert-error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    <p class="alert-info" th:if="${param.logout}">로그아웃되었습니다.</p>

    <!-- 로그인 폼 (CSRF 토큰은 Thymeleaf가 자동 추가) -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary">로그인</button>
    </form>

    <p class="login-hint">기본 계정 · 관리자 admin / admin123 · 직원 staff / staff123</p>
</div>
</body>
</html>
