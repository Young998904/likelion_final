<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직원 계정 - 통합 A/S 관리 시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar('employees')}"></aside>
    <div class="main">
        <header th:replace="~{fragments/layout :: topbar('직원 계정')}"></header>
        <main class="content">
            <div class="content-head">
                <h1 class="page-title">직원 계정</h1>
                <a class="btn primary" th:href="@{/admin/employees/new}">+ 새 계정 등록</a>
            </div>

            <div class="flash success" th:if="${message}" th:text="${message}"></div>
            <div class="flash error" th:if="${error}" th:text="${error}"></div>

            <table class="data-table">
                <thead>
                <tr>
                    <th>아이디</th>
                    <th>이름</th>
                    <th>권한</th>
                    <th>상태</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${employees}">
                    <td th:text="${e.username}">아이디</td>
                    <td th:text="${e.name}">이름</td>
                    <td th:text="${e.role.name() == 'ADMIN'} ? '최고관리자' : '일반 직원'">권한</td>
                    <td>
                        <span class="badge" th:classappend="${e.active} ? 's-completed' : ''"
                              th:text="${e.active} ? '활성' : '비활성'">상태</span>
                    </td>
                    <td class="actions">
                        <a class="btn sm" th:href="@{/admin/employees/{id}/edit(id=${e.id})}">수정</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="notice">※ 계정은 삭제하지 않고 비활성화로 사용을 중지합니다.</p>
        </main>
    </div>
</div>
</body>
</html>
