<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - 통합 A/S 관리 시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>
    <div class="main">
        <header th:replace="~{fragments/layout :: topbar('대시보드')}"></header>
        <main class="content">
            <h1 class="page-title">대시보드</h1>

            <!-- 요약 카드 -->
            <section class="card-grid">
                <div class="summary-card accent">
                    <div class="summary-label">전체 접수</div>
                    <div class="summary-value" th:text="${data.total}">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">수리중</div>
                    <div class="summary-value v-repairing" th:text="${data.repairing}">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">입금대기</div>
                    <div class="summary-value v-awaiting_payment" th:text="${data.awaitingPayment}">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">배송대기</div>
                    <div class="summary-value v-awaiting_delivery" th:text="${data.awaitingDelivery}">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">완료</div>
                    <div class="summary-value v-completed" th:text="${data.completed}">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">미입금</div>
                    <div class="summary-value v-unpaid" th:text="${data.unpaid}">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">완료 매출</div>
                    <div class="summary-value v-revenue" th:text="${#numbers.formatInteger(data.totalRevenue, 0, 'COMMA')} + '원'">0원</div>
                </div>
            </section>

            <!-- 차트 -->
            <section class="chart-row">
                <div class="panel">
                    <h2>상태별 분포</h2>
                    <div class="chart-box"><canvas id="statusChart"></canvas></div>
                </div>
                <div class="panel">
                    <h2>월별 접수 / 완료 추이</h2>
                    <div class="chart-box"><canvas id="trendChart"></canvas></div>
                </div>
            </section>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script th:inline="javascript">
    // 서버에서 전달된 통계 데이터
    const statusCounts = [
        [[${data.received}]], [[${data.repairing}]], [[${data.awaitingPayment}]],
        [[${data.awaitingDelivery}]], [[${data.completed}]]
    ];
    const months = [[${data.months}]];
    const receivedByMonth = [[${data.receivedByMonth}]];
    const completedByMonth = [[${data.completedByMonth}]];

    // 상태별 분포(도넛)
    new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
            labels: ['접수', '수리중', '입금대기', '배송대기', '완료'],
            datasets: [{
                data: statusCounts,
                backgroundColor: ['#c5cbd6', '#8b7ef0', '#e6b45a', '#5a92e0', '#3fbf8f']
            }]
        },
        options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });

    // 월별 접수/완료 추이(막대)
    new Chart(document.getElementById('trendChart'), {
        type: 'bar',
        data: {
            labels: months,
            datasets: [
                { label: '접수', data: receivedByMonth, backgroundColor: '#3b4fd4' },
                { label: '완료', data: completedByMonth, backgroundColor: '#3fbf8f' }
            ]
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
    });
</script>
</body>
</html>
