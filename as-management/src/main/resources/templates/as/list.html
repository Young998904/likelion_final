<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/S 접수 - 통합 A/S 관리 시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar('as')}"></aside>
    <div class="main">
        <header th:replace="~{fragments/layout :: topbar('A/S 접수')}"></header>
        <main class="content">
            <div class="content-head">
                <h1 class="page-title">A/S 접수</h1>
                <a class="btn primary" th:href="@{/as/new}">+ 새 접수 등록</a>
            </div>

            <div class="flash success" th:if="${message}" th:text="${message}"></div>
            <div class="flash error" th:if="${error}" th:text="${error}"></div>
            <p class="notice" th:if="${staffOnly}" style="margin-top:0;">※ 본인에게 배정된 접수 건만 표시됩니다.</p>

            <!-- 필터 -->
            <form class="row-form" method="get" th:action="@{/as}" style="margin-bottom:16px;">
                <select name="status">
                    <option value="">전체 상태</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                            th:selected="${status != null and status == s}">상태</option>
                </select>
                <input type="text" name="customerKeyword" th:value="${customerKeyword}" placeholder="고객명 검색">
                <select name="assigneeId" th:if="${!staffOnly}">
                    <option value="">전체 담당자</option>
                    <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.name}"
                            th:selected="${assigneeId != null and assigneeId == e.id}">담당자</option>
                </select>
                <button type="submit" class="btn">검색</button>
                <a class="btn" th:href="@{/as}">초기화</a>
            </form>

            <table class="data-table" th:unless="${requests.isEmpty()}">
                <thead>
                <tr>
                    <th>접수번호</th>
                    <th>고객</th>
                    <th>제품</th>
                    <th>상태</th>
                    <th>담당자</th>
                    <th>금액</th>
                    <th>접수일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${requests}" style="cursor:pointer;"
                    th:onclick="|location.href='@{/as/{id}(id=${r.id})}'|">
                    <td th:text="${r.id}">1</td>
                    <td th:text="${r.customer.name}">고객</td>
                    <td th:text="${r.product.name}">제품</td>
                    <td>
                        <span class="badge" th:classappend="${'s-' + #strings.toLowerCase(r.status)}"
                              th:text="${r.status.label}">상태</span>
                    </td>
                    <td th:text="${r.assignee != null ? r.assignee.name : '-'}">담당자</td>
                    <td class="num" th:text="${#numbers.formatInteger(r.totalAmount, 0, 'COMMA')} + '원'">0원</td>
                    <td th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</td>
                </tr>
                </tbody>
            </table>

            <div class="table-empty" th:if="${requests.isEmpty()}">접수 내역이 없습니다.</div>
        </main>
    </div>
</div>
</body>
</html>
